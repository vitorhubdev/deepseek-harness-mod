appId: ai.vitorhub.deepmod
productName: DeepMod
copyright: Copyright © DeepSeek AI (upstream MIT) — Mod “RASNER” © 2026 VitorHub — veja LICENSE e THIRD_PARTY_NOTICES.md

# OneBinary/electron IS a pnpm workspace (pnpm-workspace.yaml:14) so its deps link to the harness closure.
# `pnpm install` at root installs it together with the 268 other workspaces.
directories:
  buildResources: build
  output: out

# Keep asar:false — asar:true breaks ESM bare imports inside app.asar/node_modules
# (loader's internal.import with app.asar bareModuleBaseUrl cannot resolve nested node_modules like compression/debug).
# Verified: asar:false gives correct resolution for 202 @deepseek-ai/dsh-* packages + vendored cordis.
asar: false

compression: maximum
npmRebuild: false
removePackageScripts: true

# Auto-update via GitHub Releases — electron-updater lê `latest.yml` do release.
# O upload dos artefatos é exclusivo do job release-attach (.github/workflows/onebinary.yml),
# que anexa os binários + latest.yml + blockmap ao Release publicado. O bloco
# publish: foi removido — o owner configurado (VitorHub) não é o dono real do
# repo (vitorhubdev) e o publish do electron-builder no evento release duplicaria
# uploads do release-attach.

files:
  - from: dist
    to: dist
    filter:
      - "**/*.js"
  - from: assets
    to: assets
    filter:
      - "**/*"
  - from: ../../apps/cli
    to: apps/cli
    filter:
      - "lib/**/*"
      - "package.json"
  - from: ../../apps/web/dist
    to: apps/web/dist
    filter:
      - "**/*"
  - from: .
    to: .
    filter:
      - "package.json"

  # Exclude bloat — keep runtime JS even when it lives in a `src` folder (koffi, debug, sdk-logs)
  - "!**/*.ts"
  - "!**/*.map"
  - "!**/*.tsbuildinfo"
  - "!node_modules/**/*.ts"
  - "!node_modules/**/*.map"
  - "!node_modules/**/README.*"
  - "!node_modules/**/tsconfig.json"
  - "!node_modules/**/tsdown.config.ts"
  - "!node_modules/**/__tests__/**/*"
  - "!node_modules/**/tests/**/*"

# Linux landlock bins are optional on Windows — keep warnings silent by only copying if exists via extraResources with filter
extraResources:
  - from: ../../native/landlock-run/packages/linux-x64/bin
    to: bin
    filter: ["**/*"]
  - from: ../../native/landlock-run/packages/linux-arm64/bin
    to: bin
    filter: ["**/*"]
