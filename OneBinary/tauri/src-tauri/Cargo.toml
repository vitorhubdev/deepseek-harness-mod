[package]
name = "onebinary-tauri"
version = "0.1.0"
edition = "2021"
description = "DeepSeek Harness OneBinary — Tauri 2 host spawning Node sidecar (Cordis harness)"
authors = ["DeepSeek"]
license = "MIT"
repository = "https://github.com/deepseek-ai/deepseek-harness"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
tauri-plugin-shell = "2.1"
tauri-plugin-single-instance = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
