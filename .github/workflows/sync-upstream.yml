name: Sync upstream master

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/sync-upstream.yml

permissions:
  contents: write

concurrency:
  group: sync-upstream-master
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge DeepSeek upstream and preserve fork customizations
        shell: bash
        run: |
          set -euo pipefail

          git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git 2>/dev/null \
            || git remote set-url upstream https://github.com/deepseek-ai/deepseek-harness.git
          git fetch upstream master --tags

          upstream_sha="$(git rev-parse upstream/master)"
          before_sha="$(git rev-parse HEAD)"
          echo "Fork before: ${before_sha}"
          echo "Upstream:    ${upstream_sha}"

          set +e
          git merge --no-ff --no-commit -X ours upstream/master
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            echo "Merge left unresolved paths; preserving the fork side only for those conflicts."
            mapfile -d '' conflicts < <(git diff --name-only --diff-filter=U -z)
            if [ "${#conflicts[@]}" -eq 0 ]; then
              echo "Merge failed without ordinary file conflicts."
              git status --short
              exit "$merge_status"
            fi

            for path in "${conflicts[@]}"; do
              echo "Resolving in favor of fork customization: ${path}"
              if git cat-file -e "${before_sha}:${path}" 2>/dev/null; then
                git checkout "$before_sha" -- "$path"
                git add -- "$path"
              else
                git rm -f --ignore-unmatch -- "$path"
              fi
            done

            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "Unresolved conflicts remain:"
              git diff --name-only --diff-filter=U
              exit 1
            fi
          fi

          # Preserve this fork's workflow set: the default Actions token cannot
          # write workflow files, and these workflows contain fork-specific CI.
          mapfile -d '' workflow_changes < <(git diff --name-only -z "$before_sha" -- .github/workflows)
          for path in "${workflow_changes[@]}"; do
            echo "Preserving fork workflow: ${path}"
            if git cat-file -e "${before_sha}:${path}" 2>/dev/null; then
              git checkout "$before_sha" -- "$path"
              git add -- "$path"
            else
              git rm -f --ignore-unmatch -- "$path"
            fi
          done

          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit -m "merge: sync deepseek-ai/deepseek-harness upstream master ${upstream_sha:0:12}"
          else
            echo "No merge commit needed."
          fi

      - name: Ensure OpenCode Go session affinity support
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          adapter_path = Path('packages/llm/llm-pi-ai/src/adapter.ts')
          config_path = Path('packages/llm/llm-pi-ai/src/config.ts')
          test_path = Path('packages/llm/llm-pi-ai/tests/adapter.spec.ts')

          adapter = adapter_path.read_text()
          config = config_path.read_text()
          tests = test_path.read_text()

          def replace_once(text: str, needle: str, replacement: str, label: str) -> str:
              if needle not in text:
                  raise SystemExit(f'{label} insertion point changed upstream')
              return text.replace(needle, replacement, 1)

          if 'sessionHeader?: string' not in config:
              needle = '  headers?: Record<string, string>\n'
              replacement = needle + '\n'.join([
                  '  /**',
                  '   * Header receiving the per-conversation Harness session id. The',
                  '   * `opencode-go` route defaults to `x-opencode-session`; other routes',
                  '   * opt in explicitly. The dynamic value wins a same-name static header.',
                  '   */',
                  '  sessionHeader?: string',
                  '',
              ])
              config = replace_once(config, needle, replacement, 'config interface')

              needle = '  headers: z.dict(z.string()),\n'
              replacement = needle + '  sessionHeader: z.string(),\n'
              config = replace_once(config, needle, replacement, 'config schema')

              validation_marker = '\n/**\n * Resolve scalar defaults and materialize each route\'s serviceable models.'
              validation = '\n'.join([
                  '',
                  '/** Reject a configured dynamic session-header name that Fetch cannot represent. */',
                  'function assertValidSessionHeader(provider: string, sessionHeader: string | undefined): void {',
                  '  if (sessionHeader === undefined) return',
                  '  try {',
                  "    new Headers([[sessionHeader, 'session']])",
                  '  } catch {',
                  '    throw new Error(',
                  '      `llm-pi-ai: provider "${provider}" sessionHeader "${sessionHeader}" is not a valid HTTP field name`,',
                  '    )',
                  '  }',
                  '}',
              ])
              config = replace_once(config, validation_marker, validation + validation_marker, 'session header validator')

              needle = '    assertValidHeaders(provider, source.headers)\n'
              replacement = needle + '    assertValidSessionHeader(provider, source.sessionHeader)\n'
              config = replace_once(config, needle, replacement, 'profile validation')

          if "'x-opencode-session'" not in adapter:
              start_marker = '/** Merge deployment headers while removing case-insensitive attribution collisions. */'
              end_marker = '\n\n/**\n * pi-ai-backed multi-provider adapter.'
              try:
                  start = adapter.index(start_marker)
                  end = adapter.index(end_marker, start)
              except ValueError as error:
                  raise SystemExit('requestHeaders insertion point changed upstream') from error

              request_headers = '\n'.join([
                  '/** Merge deployment headers while protecting dynamic session affinity and Harness attribution. */',
                  'function requestHeaders(',
                  '  headers: Readonly<Record<string, string>> | undefined,',
                  '  sessionHeader: string | undefined,',
                  '  sessionId: string | undefined,',
                  '): Record<string, string> {',
                  '  const attribution = attributionHeaders()',
                  '  const reserved = new Set([',
                  '    ...Object.keys(attribution),',
                  '    ...(sessionHeader === undefined ? [] : [sessionHeader]),',
                  '  ].map(name => name.toLowerCase()))',
                  '  const dynamicSession = sessionHeader === undefined || sessionId === undefined',
                  '    ? {}',
                  '    : { [sessionHeader]: sessionId }',
                  '  return {',
                  '    ...Object.fromEntries(Object.entries(headers ?? {}).filter(([name]) => !reserved.has(name.toLowerCase()))),',
                  '    ...dynamicSession,',
                  '    ...attribution,',
                  '  }',
                  '}',
              ])
              adapter = adapter[:start] + request_headers + adapter[end:]

              needle = '      const events = snapshot.models.streamSimple(model, context, {\n'
              prefix = '\n'.join([
                  '      const sessionId = options.sessionId === undefined ? undefined : String(options.sessionId)',
                  '      const sessionHeader = profile.sessionHeader',
                  "        ?? (options.provider === 'opencode-go' ? 'x-opencode-session' : undefined)",
                  '',
              ])
              adapter = replace_once(adapter, needle, prefix + needle, 'stream session header')
              adapter = replace_once(
                  adapter,
                  '        ...options.sessionId === undefined ? {} : { sessionId: String(options.sessionId) },\n',
                  '        ...sessionId === undefined ? {} : { sessionId },\n',
                  'stream session id',
              )
              adapter = replace_once(
                  adapter,
                  '        // Profile headers are deployment-owned; attribution names are\n        // Harness-owned and therefore win collisions.\n        headers: requestHeaders(profile.headers),\n',
                  '        // Profile headers are deployment-owned; dynamic session affinity and\n        // Harness attribution are runtime-owned and therefore win collisions.\n        headers: requestHeaders(profile.headers, sessionHeader, sessionId),\n',
                  'stream request headers',
              )

          marker = 'sends the OpenCode Go session id as x-opencode-session'
          if marker not in tests:
              anchor = "  it('forwards common stream options and profile reasoning', async () => {\n"
              test = '\n'.join([
                  "  it('sends the OpenCode Go session id as x-opencode-session and overrides a static value', async () => {",
                  '    const server = await mockServer([{ events: textEvents }, { events: textEvents }])',
                  '    const ctx = new Context()',
                  '    await ctx.plugin(LlmRuntime)',
                  "    ctx.llm.registerAdapter(['opencode-go'], adapterOf({",
                  "      'opencode-go': {",
                  "        api: 'openai-completions',",
                  '        baseURL: server.url,',
                  "        models: [{ id: 'go-model' }],",
                  "        headers: { 'X-OpenCode-Session': 'static-wrong' },",
                  '      },',
                  '    }))',
                  '',
                  '    await assemble(ctx, {',
                  "      provider: 'opencode-go',",
                  "      model: 'go-model',",
                  '      messages: [],',
                  "      sessionId: 'conversation-a' as never,",
                  '    })',
                  '    await assemble(ctx, {',
                  "      provider: 'opencode-go',",
                  "      model: 'go-model',",
                  '      messages: [],',
                  "      sessionId: 'conversation-b' as never,",
                  '    })',
                  '',
                  "    expect(server.headers[0]?.['x-opencode-session']).toBe('conversation-a')",
                  "    expect(server.headers[1]?.['x-opencode-session']).toBe('conversation-b')",
                  '  })',
                  '',
                  "  it('supports an explicit dynamic session header on custom provider routes', async () => {",
                  '    const server = await mockServer([{ events: textEvents }])',
                  '    const ctx = new Context()',
                  '    await ctx.plugin(LlmRuntime)',
                  "    ctx.llm.registerAdapter(['custom-gateway'], adapterOf({",
                  "      'custom-gateway': {",
                  "        api: 'openai-completions',",
                  '        baseURL: server.url,',
                  "        models: [{ id: 'custom-model' }],",
                  "        sessionHeader: 'x-session-affinity',",
                  '      },',
                  '    }))',
                  '',
                  '    await assemble(ctx, {',
                  "      provider: 'custom-gateway',",
                  "      model: 'custom-model',",
                  '      messages: [],',
                  "      sessionId: 'custom-conversation' as never,",
                  '    })',
                  '',
                  "    expect(server.headers[0]?.['x-session-affinity']).toBe('custom-conversation')",
                  '  })',
                  '',
              ])
              tests = replace_once(tests, anchor, test + anchor, 'adapter tests')

          adapter_path.write_text(adapter)
          config_path.write_text(config)
          test_path.write_text(tests)
          PY

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable

          # OneBinary is a fork-only assembly whose manifest still references
          # packages removed upstream. Exclude it only while installing the
          # upstream workspace needed for llm-pi-ai validation.
          cp pnpm-workspace.yaml /tmp/pnpm-workspace.yaml
          trap 'cp /tmp/pnpm-workspace.yaml pnpm-workspace.yaml; git checkout -- pnpm-lock.yaml' EXIT
          python3 - <<'PY'
          from pathlib import Path
          path = Path('pnpm-workspace.yaml')
          path.write_text(path.read_text().replace('  - OneBinary/electron\n', ''))
          PY
          pnpm install --no-frozen-lockfile
          cp /tmp/pnpm-workspace.yaml pnpm-workspace.yaml
          git checkout -- pnpm-lock.yaml
          trap - EXIT

      - name: Test OpenCode Go session support
        run: |
          ./node_modules/.bin/vitest run packages/llm/llm-pi-ai/tests/adapter.spec.ts packages/llm/llm-pi-ai/tests/config.spec.ts
          ./node_modules/.bin/tsc -p packages/llm/llm-pi-ai/tsconfig.json --noEmit

      - name: Commit and push synchronized source
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git add packages/llm/llm-pi-ai/src/adapter.ts \
              packages/llm/llm-pi-ai/src/config.ts \
              packages/llm/llm-pi-ai/tests/adapter.spec.ts
            git commit -m "feat(llm-pi-ai): support OpenCode Go session affinity"
          fi
          echo "Result: $(git rev-parse HEAD)"
          git status --short
          git push origin HEAD:master
