name: Sync upstream master

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/sync-upstream.yml

permissions:
  contents: write

concurrency:
  group: sync-upstream-master
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge DeepSeek upstream and preserve fork customizations
        shell: bash
        run: |
          set -euo pipefail

          git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git 2>/dev/null \
            || git remote set-url upstream https://github.com/deepseek-ai/deepseek-harness.git
          git fetch upstream master --tags

          upstream_sha="$(git rev-parse upstream/master)"
          before_sha="$(git rev-parse HEAD)"
          echo "Fork before: ${before_sha}"
          echo "Upstream:    ${upstream_sha}"

          set +e
          git merge --no-ff --no-commit -X ours upstream/master
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            echo "Merge left unresolved paths; preserving the fork side only for those conflicts."
            mapfile -d '' conflicts < <(git diff --name-only --diff-filter=U -z)
            if [ "${#conflicts[@]}" -eq 0 ]; then
              echo "Merge failed without ordinary file conflicts."
              git status --short
              exit "$merge_status"
            fi

            for path in "${conflicts[@]}"; do
              echo "Resolving in favor of fork customization: ${path}"
              if git cat-file -e "${before_sha}:${path}" 2>/dev/null; then
                git checkout "$before_sha" -- "$path"
                git add -- "$path"
              else
                git rm -f --ignore-unmatch -- "$path"
              fi
            done

            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "Unresolved conflicts remain:"
              git diff --name-only --diff-filter=U
              exit 1
            fi
          fi

          # The Actions token has contents:write but cannot update workflow files.
          # Keep this fork's workflow set byte-for-byte so the source sync can be pushed
          # and so fork-specific CI/OneBinary behavior is not replaced by upstream CI.
          mapfile -d '' workflow_changes < <(git diff --name-only -z "$before_sha" -- .github/workflows)
          for path in "${workflow_changes[@]}"; do
            echo "Preserving fork workflow: ${path}"
            if git cat-file -e "${before_sha}:${path}" 2>/dev/null; then
              git checkout "$before_sha" -- "$path"
              git add -- "$path"
            else
              git rm -f --ignore-unmatch -- "$path"
            fi
          done

          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit -m "merge: sync deepseek-ai/deepseek-harness upstream master ${upstream_sha:0:12}"
          else
            echo "No merge commit needed."
          fi

      - name: Ensure OpenCode Go session affinity support
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          adapter_path = Path('packages/llm/llm-pi-ai/src/adapter.ts')
          config_path = Path('packages/llm/llm-pi-ai/src/config.ts')
          test_path = Path('packages/llm/llm-pi-ai/tests/adapter.spec.ts')

          adapter = adapter_path.read_text()
          config = config_path.read_text()
          tests = test_path.read_text()

          if 'sessionHeader?: string' not in config:
              old = """  /** Provider request headers, validated against Fetch when the profile resolves; Harness attribution wins reserved names. */
          headers?: Record<string, string>
          /** Provider-neutral pi-ai reasoning level. */
          """
              new = """  /** Provider request headers, validated against Fetch when the profile resolves; Harness attribution wins reserved names. */
          headers?: Record<string, string>
          /**
           * Header receiving the per-conversation Harness session id. The
           * `opencode-go` route defaults to `x-opencode-session`; other routes
           * opt in explicitly. The dynamic value wins a same-name static header.
           */
          sessionHeader?: string
          /** Provider-neutral pi-ai reasoning level. */
          """
              if old not in config:
                  raise SystemExit('config interface insertion point changed upstream')
              config = config.replace(old, new, 1)

              old = """  headers: z.dict(z.string()),
          reasoning: z.union(THINKING_LEVELS),
          """
              new = """  headers: z.dict(z.string()),
          sessionHeader: z.string(),
          reasoning: z.union(THINKING_LEVELS),
          """
              if old not in config:
                  raise SystemExit('config schema insertion point changed upstream')
              config = config.replace(old, new, 1)

              old = """function assertValidHeaders(provider: string, headers: Readonly<Record<string, string>> | undefined): void {
            for (const [name, value] of Object.entries(headers ?? {})) {
              try {
                new Headers([[name, value]])
              } catch {
                throw new Error(
                  `llm-pi-ai: provider \"${provider}\" header \"${name}\" is not valid for Fetch;`
                  + ' use a valid HTTP field name and a single-line value representable as bytes',
                )
              }
            }
          }
          """
              new = old + """
          /** Reject a configured dynamic session header name that Fetch cannot represent. */
          function assertValidSessionHeader(provider: string, sessionHeader: string | undefined): void {
            if (sessionHeader === undefined) return
            try {
              new Headers([[sessionHeader, 'session']])
            } catch {
              throw new Error(
                `llm-pi-ai: provider \"${provider}\" sessionHeader \"${sessionHeader}\" is not a valid HTTP field name`,
              )
            }
          }
          """
              if old not in config:
                  raise SystemExit('header validation insertion point changed upstream')
              config = config.replace(old, new, 1)

              old = """    assertValidHeaders(provider, source.headers)
            const streamIdleTimeoutMs = source.streamIdleTimeoutMs ?? DEFAULT_STREAM_IDLE_TIMEOUT_MS
          """
              new = """    assertValidHeaders(provider, source.headers)
            assertValidSessionHeader(provider, source.sessionHeader)
            const streamIdleTimeoutMs = source.streamIdleTimeoutMs ?? DEFAULT_STREAM_IDLE_TIMEOUT_MS
          """
              if old not in config:
                  raise SystemExit('profile validation callsite changed upstream')
              config = config.replace(old, new, 1)

          if "'x-opencode-session'" not in adapter:
              old = """/** Merge deployment headers while removing case-insensitive attribution collisions. */
          function requestHeaders(headers: Readonly<Record<string, string>> | undefined): Record<string, string> {
            const attribution = attributionHeaders()
            const reserved = new Set(Object.keys(attribution).map(name => name.toLowerCase()))
            return {
              ...Object.fromEntries(Object.entries(headers ?? {}).filter(([name]) => !reserved.has(name.toLowerCase()))),
              ...attribution,
            }
          }
          """
              new = """/** Merge deployment headers while protecting dynamic session affinity and Harness attribution. */
          function requestHeaders(
            headers: Readonly<Record<string, string>> | undefined,
            sessionHeader: string | undefined,
            sessionId: string | undefined,
          ): Record<string, string> {
            const attribution = attributionHeaders()
            const reserved = new Set([
              ...Object.keys(attribution),
              ...sessionHeader === undefined ? [] : [sessionHeader],
            ].map(name => name.toLowerCase()))
            const dynamicSession = sessionHeader === undefined || sessionId === undefined
              ? {}
              : { [sessionHeader]: sessionId }
            return {
              ...Object.fromEntries(Object.entries(headers ?? {}).filter(([name]) => !reserved.has(name.toLowerCase()))),
              ...dynamicSession,
              ...attribution,
            }
          }
          """
              if old not in adapter:
                  raise SystemExit('requestHeaders implementation changed upstream')
              adapter = adapter.replace(old, new, 1)

              old = """      const events = snapshot.models.streamSimple(model, context, {
                ...profileOptions(profile, reasoning, apiKey),
                ...options.temperature === undefined ? {} : { temperature: options.temperature },
                ...options.maxTokens === undefined ? {} : { maxTokens: options.maxTokens },
                ...options.sessionId === undefined ? {} : { sessionId: String(options.sessionId) },
                signal: watchdog.signal,
                // Profile headers are deployment-owned; attribution names are
                // Harness-owned and therefore win collisions.
                headers: requestHeaders(profile.headers),
              })
          """
              new = """      const sessionId = options.sessionId === undefined ? undefined : String(options.sessionId)
              const sessionHeader = profile.sessionHeader
                ?? (options.provider === 'opencode-go' ? 'x-opencode-session' : undefined)
              const events = snapshot.models.streamSimple(model, context, {
                ...profileOptions(profile, reasoning, apiKey),
                ...options.temperature === undefined ? {} : { temperature: options.temperature },
                ...options.maxTokens === undefined ? {} : { maxTokens: options.maxTokens },
                ...sessionId === undefined ? {} : { sessionId },
                signal: watchdog.signal,
                // Profile headers are deployment-owned; a per-session affinity
                // header and Harness attribution are runtime-owned and win collisions.
                headers: requestHeaders(profile.headers, sessionHeader, sessionId),
              })
          """
              if old not in adapter:
                  raise SystemExit('streamSimple callsite changed upstream')
              adapter = adapter.replace(old, new, 1)

          marker = "sends the OpenCode Go session id as x-opencode-session"
          if marker not in tests:
              anchor = """  it('forwards common stream options and profile reasoning', async () => {
          """
              test = """  it('sends the OpenCode Go session id as x-opencode-session and overrides a static value', async () => {
            const server = await mockServer([{ events: textEvents }, { events: textEvents }])
            const ctx = new Context()
            await ctx.plugin(LlmRuntime)
            ctx.llm.registerAdapter(['opencode-go'], adapterOf({
              'opencode-go': {
                api: 'openai-completions',
                baseURL: server.url,
                models: [{ id: 'go-model' }],
                headers: { 'X-OpenCode-Session': 'static-wrong' },
              },
            }))

            await assemble(ctx, {
              provider: 'opencode-go',
              model: 'go-model',
              messages: [],
              sessionId: 'conversation-a' as never,
            })
            await assemble(ctx, {
              provider: 'opencode-go',
              model: 'go-model',
              messages: [],
              sessionId: 'conversation-b' as never,
            })

            expect(server.headers[0]?.['x-opencode-session']).toBe('conversation-a')
            expect(server.headers[1]?.['x-opencode-session']).toBe('conversation-b')
          })

            it('supports an explicit dynamic session header on custom provider routes', async () => {
            const server = await mockServer([{ events: textEvents }])
            const ctx = new Context()
            await ctx.plugin(LlmRuntime)
            ctx.llm.registerAdapter(['custom-gateway'], adapterOf({
              'custom-gateway': {
                api: 'openai-completions',
                baseURL: server.url,
                models: [{ id: 'custom-model' }],
                sessionHeader: 'x-session-affinity',
              },
            }))

            await assemble(ctx, {
              provider: 'custom-gateway',
              model: 'custom-model',
              messages: [],
              sessionId: 'custom-conversation' as never,
            })

            expect(server.headers[0]?.['x-session-affinity']).toBe('custom-conversation')
          })

          """
              if anchor not in tests:
                  raise SystemExit('adapter test insertion point changed upstream')
              tests = tests.replace(anchor, test + anchor, 1)

          adapter_path.write_text(adapter)
          config_path.write_text(config)
          test_path.write_text(tests)
          PY

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Test OpenCode Go session support
        run: |
          pnpm exec vitest run packages/llm/llm-pi-ai/tests/adapter.spec.ts packages/llm/llm-pi-ai/tests/config.spec.ts
          pnpm exec tsc -p packages/llm/llm-pi-ai/tsconfig.json --noEmit

      - name: Commit and push synchronized source
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git add packages/llm/llm-pi-ai/src/adapter.ts \
              packages/llm/llm-pi-ai/src/config.ts \
              packages/llm/llm-pi-ai/tests/adapter.spec.ts
            git commit -m "feat(llm-pi-ai): support OpenCode Go session affinity"
          fi
          echo "Result: $(git rev-parse HEAD)"
          git status --short
          git push origin HEAD:master
