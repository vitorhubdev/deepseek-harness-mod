name: OneBinary

on:
  push:
    branches: [master]
    tags: ['v*']
    paths:
      - "OneBinary/electron/**"
      - "apps/**"
      - "packages/**"
      - "vendor/**"
      - "native/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/onebinary.yml"
  pull_request:
    paths:
      - "OneBinary/electron/**"
      - "apps/**"
      - "packages/**"
      - "vendor/**"
      - "native/**"
      - "pnpm-lock.yaml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PRIMARY_NODE_VERSION: '24'

jobs:
  # Fail-fast do build oficial apenas. Os gates estáticos de docs do upstream
  # (check:ci:static) pertencem ao workflow CI master — exigir aqui bloqueava a
  # produção de artefatos do fork sem relação com o build Electron.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:official

  # ── Mine Electron matrix — cada OS compila nativo (portable/AppImage/deb/dmg/zip) ──
  build-electron:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: win
            build: pnpm --filter onebinary-electron run build:win
            artifact: DeepMod-win
            path: |
              OneBinary/electron/out/DeepMod*.exe
              OneBinary/electron/out/*.exe
              OneBinary/electron/out/*.blockmap
              OneBinary/electron/out/*.yml
          - os: ubuntu-24.04
            label: linux
            build: pnpm --filter onebinary-electron run build:linux
            artifact: DeepMod-linux
            path: |
              OneBinary/electron/out/*.AppImage
              OneBinary/electron/out/*.deb
              OneBinary/electron/out/*.blockmap
              OneBinary/electron/out/*.yml
          - os: macos-14
            label: mac
            build: pnpm --filter onebinary-electron run build:mac
            artifact: DeepMod-mac
            path: |
              OneBinary/electron/out/*.dmg
              OneBinary/electron/out/*.zip
              OneBinary/electron/out/*.blockmap
              OneBinary/electron/out/*.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build harness (official)
        run: pnpm run build:official

      - name: Build Electron — ${{ matrix.label }} (x64 + x86/arm64/universal conforme electron-builder.yml)
        run: ${{ matrix.build }}

      - name: Upload ${{ matrix.label }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 14

  release-attach:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: build-electron
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-artifacts
          merge-multiple: true
      - name: Attach executables to GitHub Release (Win/Linux/macOS, x64/x86/universal)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./release-artifacts/DeepMod *
            ./release-artifacts/*.exe
            ./release-artifacts/*.AppImage
            ./release-artifacts/*.deb
            ./release-artifacts/*.dmg
            ./release-artifacts/*.zip
            ./release-artifacts/*.yml
            ./release-artifacts/*.blockmap
          fail_on_unmatched_files: false
          generate_release_notes: true
